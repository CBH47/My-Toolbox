publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.11.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  http: ^1.3.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
